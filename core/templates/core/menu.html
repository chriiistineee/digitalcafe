{% extends "base.html" %}

{% block title %}Menu{% endblock %}

{% block content %}
    <h1>Menu</h1>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price (PHP)</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
                <tr>
                    <td>{{ product.name }}</td>
                    <td>{{ product.price }}</td>
                    <td>
                        {% if user.is_authenticated %}
                            <form class="inline" method="post" action="{% url 'core:add_to_cart' product.id %}">
                                {% csrf_token %}
                                <button type="submit">Add to cart</button>
                            </form>
                        {% endif %}
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No products yet.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
